receivers:
  postgresql:
    endpoint: db:5432
    transport: tcp
    username: "${env:OTELC_POSTGRES_USERNAME}"
    password: "${env:OTELC_POSTGRES_PASSWORD}"
    databases: []
    collection_interval: 10s
    tls:
      insecure: true

processors:
  # This prevents OTel from consuming all the memory
  memory_limiter:
    check_interval: 1s
    limit_mib: 150
    spike_limit_mib: 30

  # Injects some metadata for Grafana
  attributes/env:
    actions:
      - key: environment
        value: "homelab"
        action: insert

  # Adds some resource attributes as labels
  transform/db_labels:
    metric_statements:
      - context: datapoint
        statements:
        - set(attributes["db_name"], resource.attributes["postgresql.database.name"]) where resource.attributes["postgresql.database.name"] != nil
        - set(attributes["table_name"], resource.attributes["postgresql.table.name"]) where resource.attributes["postgresql.table.name"] != nil
        # The index is way too excesive imo but I want to see how useful it actually is and form an opinion about adding it
        - set(attributes["index_name"], resource.attributes["postgresql.index.name"]) where resource.attributes["postgresql.index.name"] != nil

  # Compresses the data before exporting it
  batch:
    send_batch_size: 100
    timeout: 10s

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    send_timestamps: true

  debug:
    verbosity: detailed

service:
  pipelines:
    metrics:
      receivers: [postgresql]
      processors: [memory_limiter, attributes/env, transform/db_labels, batch]
      exporters: [prometheus]
