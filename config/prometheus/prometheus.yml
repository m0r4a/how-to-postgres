# yaml-language-server: $schema=https://json.schemastore.org/prometheus.json

global:
  scrape_interval: 15s
  evaluation_interval: 30s

scrape_configs:
  - job_name: postgres
    honor_labels: true
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets:
          - otel-collector:8889

  - job_name: prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9090']
