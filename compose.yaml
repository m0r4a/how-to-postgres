# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

services:
  db:
    image: postgres:18-bookworm
    container_name: db
    restart: unless-stopped
    # Incident 27 is an OOM kill, this is needed
    mem_limit: 1g
    volumes:
      - pg-data:/var/lib/postgresql/18/docker

      # Mounted outside PGDATA and selected with -c config_file below.
      # If you drop a file next to (and not inside) PGDATA is silently ignored by postgres.
      - ./config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./scripts/setup.sh:/docker-entrypoint-initdb.d/setup.sh:ro
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USR}
      POSTGRES_PASSWORD: ${POSTGRES_PWD}

      # Consumed by scripts/setup.sh on first boot only
      # you can do "docker compose down -v" to wipe the named volume
      PE_POSTGRES_USERNAME: ${PE_POSTGRES_USERNAME}
      PE_POSTGRES_PASSWORD: ${PE_POSTGRES_PASSWORD}
      MONITORING_DB_USERNAME: ${MONITORING_DB_USERNAME}
      MONITORING_DB_PASSWORD: ${MONITORING_DB_PASSWORD}
      PGBENCH_DB_USERNAME: ${PGBENCH_DB_USERNAME}
      PGBENCH_DB_PASSWORD: ${PGBENCH_DB_PASSWORD}
      PGBENCH_DB_NAME: ${PGBENCH_DB_NAME}

    # Settings that only can be changed with a restart (max_connections, shared_buffers,
    # max_prepared_transactions) live in config/postgres/postgresql.conf.

    # "Reloadable" observability settings are set here so they apply from boot.
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
      -c shared_preload_libraries=pg_stat_statements,auto_explain
      -c pg_stat_statements.track=all
      -c pg_stat_statements.max=10000
      -c auto_explain.log_min_duration=500ms
      -c auto_explain.log_analyze=on
      -c track_io_timing=on
      -c track_wal_io_timing=on
      -c log_checkpoints=on
      -c log_lock_waits=on
      -c log_autovacuum_min_duration=0
      -c log_temp_files=10MB
      -c log_min_duration_statement=1000
      -c max_slot_wal_keep_size=2GB

    # Temporarily commented out since the image currently doesn't have pgbackrest
    # -c archive_mode=on
    # -c archive_command='pgbackrest --stanza=main archive-push %p'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USR} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - db

  traefik:
    image: traefik:v3.7.10
    container_name: traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.cloudflare.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge=true"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"
      - "--log.level=INFO"
      - "--accesslog=true"
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    networks:
      - public

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.14.0
    volumes:
      - prometheus-data:/prometheus
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=public"
      - "traefik.http.routers.prometheus.rule=Host(`${PROMETHEUS_SUBDOMAIN}.${DOMAIN}`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls.certresolver=cloudflare"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=90d"
      - "--storage.tsdb.retention.size=10GB"
    networks:
      - monitoring
      - public

  grafana:
    container_name: grafana
    image: grafana/grafana:13.2
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    ports:
      - 3000:3000
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=public"
      - "traefik.http.routers.grafana.rule=Host(`${GRAFANA_SUBDOMAIN}.${DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=cloudflare"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    networks:
      - monitoring
      - db
      - public
    depends_on:
      db:
        condition: service_healthy

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=10s"
      - "--store_container_labels=false"
      - "--disable_metrics=percpu,sched,tcp,udp,process,hugetlb,referenced_memory,cpu_topology,resctrl"
    networks:
      - monitoring

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: postgres_exporter
    environment:
      - DATA_SOURCE_URI=${PE_POSTGRES_URI}
      - DATA_SOURCE_USER=${PE_POSTGRES_USERNAME}
      - DATA_SOURCE_PASS=${PE_POSTGRES_PASSWORD}
    command:
      - "--collector.stat_activity_autovacuum"
    networks:
      - monitoring
      - db
    depends_on:
      db:
        condition: service_healthy

volumes:
  traefik-letsencrypt:
  prometheus-data:
  grafana-data:
  pg-data:

networks:
  public:
    name: public
    driver: bridge
  db:
    name: db
    driver: bridge
  monitoring:
    name: monitoring
    driver: bridge
